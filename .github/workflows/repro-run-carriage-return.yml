name: Reproduce cargo run carriage-return overwrite

on:
  workflow_dispatch:
  push:
    branches:
      - repro-run-carriage-return

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      RUSTUP_WINDOWS_PATH_ADD_BIN: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup update --no-self-update stable-msvc
      - run: rustup default stable-msvc
      - name: Capture the rendered Windows console
        env:
          SNAPSHOTS: overwrite
        run: >-
          cargo test -p cargo --test testsuite --
          run::exit_code_with_carriage_return_preserves_output --exact --nocapture
      - name: Verify the checked-in console snapshot
        run: >-
          git diff --exit-code --
          tests/testsuite/run/exit_code_with_carriage_return_preserves_output.term.svg
      - name: Upload the rendered console
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: carriage-return-console
          path: tests/testsuite/run/exit_code_with_carriage_return_preserves_output.term.svg
          if-no-files-found: error
